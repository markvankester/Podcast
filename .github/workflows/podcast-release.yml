name: Podcast release APK

on:
  push:
    branches: [ redesign ]
  workflow_dispatch:

concurrency:
  group: podcast-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'markvankester/Podcast'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PODCAST_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/podcast-release.jks"
      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.PODCAST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PODCAST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PODCAST_KEY_PASSWORD }}
        run: >
          ./gradlew --console=plain :app:assemblePlayRelease
          -PreleaseStoreFile="$RUNNER_TEMP/podcast-release.jks"
          -PreleaseStorePassword="$STORE_PASSWORD"
          -PreleaseKeyAlias="$KEY_ALIAS"
          -PreleaseKeyPassword="$KEY_PASSWORD"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="podcast-build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/play/release/app-play-release.apk "$RUNNER_TEMP/Podcast.apk"
          gh release create "$TAG" "$RUNNER_TEMP/Podcast.apk" \
            --target "$GITHUB_SHA" \
            --title "Podcast build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::9} on ${GITHUB_REF_NAME}." \
            --latest
